[package]
name = "penguin-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
bevy = { version = "=0.19.1", default-features = false }
bevy_math = "=0.19.1"
eframe = { version = "=0.33.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
debug = 0
opt-level = 1

